<div class="page-header"><div class="container"><h1>Lịch Sử Đặt Tour</h1></div></div>
<section class="section">
  <div class="container">
    <div class="loading-spinner" *ngIf="loading"><div class="spinner"></div></div>
    <div class="alert alert-danger" *ngIf="!loading && error">{{ error }}</div>
    <table class="data-table" *ngIf="!loading && bookings.length">
      <thead><tr><th>Mã</th><th>Tour</th><th>Ngày đi</th><th>Số người</th><th>Tổng tiền</th><th>Trạng thái</th><th></th></tr></thead>
      <tbody>
        <tr *ngFor="let b of bookings">
          <td><strong>{{ b.bookingCode }}</strong></td>
          <td><a [routerLink]="['/tours', b.tour?.slug]">{{ b.tour?.name }}</a></td>
          <td>{{ b.startDate | date:'dd/MM/yyyy' }}</td>
          <td>{{ b.peopleCount }}</td>
          <td>{{ b.totalAmount | number:'1.0-0' }}đ</td>
          <td><span class="badge" [class.badge-warning]="b.status==='pending'" [class.badge-success]="b.status==='confirmed'" [class.badge-danger]="b.status==='cancelled'">{{ statusLabel(b.status) }}</span></td>
          <td><button class="btn btn-sm btn-outline" *ngIf="b.status==='pending'" (click)="cancel(b)">Hủy</button></td>
        </tr>
      </tbody>
    </table>
    <div class="empty-state" *ngIf="!loading && bookings.length === 0">
      <span class="material-icons">event_busy</span>
      <h3>Chưa có booking nào</h3>
      <a routerLink="/tours" class="btn btn-primary">Khám phá tour</a>
    </div>
  </div>
</section>

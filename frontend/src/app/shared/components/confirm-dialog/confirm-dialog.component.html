<ng-container *ngIf="state$ | async as state">
  <div class="confirm-backdrop" *ngIf="state.open" (click)="cancel()">
    <div
      class="confirm-modal"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="'confirm-dialog-title'"
      [attr.aria-describedby]="'confirm-dialog-message'"
      (click)="$event.stopPropagation()"
    >
      <button type="button" class="confirm-close" aria-label="Đóng" (click)="cancel()">
        <span class="material-icons">close</span>
      </button>

      <div class="confirm-icon">
        <span class="material-icons">{{ state.icon }}</span>
      </div>

      <div class="confirm-content">
        <h2 id="confirm-dialog-title">{{ state.title }}</h2>
        <p id="confirm-dialog-message">{{ state.message }}</p>
      </div>

      <div class="confirm-actions">
        <button type="button" class="btn btn-ghost" (click)="cancel()">{{ state.cancelText }}</button>
        <button type="button" class="btn btn-danger" (click)="confirm()">{{ state.confirmText }}</button>
      </div>
    </div>
  </div>
</ng-container>


<section class="section">
  <div class="container">
    <div class="loading-spinner" *ngIf="loading"><div class="spinner"></div></div>
    <div class="data-table-wrapper" *ngIf="!loading">
      <table class="data-table">
        <thead><tr><th>Người dùng</th><th>Địa điểm / Tour</th><th>Nội dung</th><th>Rating</th><th>Ngày</th><th>Hành động</th></tr></thead>
        <tbody>
          <tr *ngFor="let r of data">
            <td><strong>{{ r.user?.fullName }}</strong></td>
            <td style="color:var(--gray);font-size:0.8125rem;">
              <span *ngIf="r.destination">{{ r.destination.name }}</span>
              <span *ngIf="r.tour">{{ r.tour.name }}</span>
              <span *ngIf="!r.destination && !r.tour" style="color:var(--gray-light);">-</span>
            </td>
            <td style="color:var(--gray);font-size:0.875rem;max-width:300px;"><span style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">{{ r.comment }}</span></td>
            <td>
              <div class="rating">
                <span class="stars">
                  <ng-container *ngFor="let s of getStars(r.rating)">{{ s }}</ng-container>
                </span>
              </div>
            </td>
            <td style="color:var(--gray);font-size:0.875rem;">{{ r.createdAt | date:'dd/MM/yyyy' }}</td>
            <td><button class="btn btn-sm btn-danger" (click)="delete(r.id)"><span class="material-icons">delete</span></button></td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="empty-state" *ngIf="!loading && data.length === 0">
      <span class="material-icons">star_border</span>
      <h3>Chưa có đánh giá nào</h3>
    </div>
    <div class="pagination-wrapper" *ngIf="!loading && totalPages > 1">
      <div class="pagination-info">Hiển thị {{ data.length }} / {{ total }} đánh giá</div>
      <div class="pagination">
        <button (click)="prev()" [disabled]="page === 1" class="page-nav">
          <span class="material-icons">chevron_left</span>
        </button>
        <button *ngFor="let p of pageNumbers" [class.active]="p === page" [class.ellipsis]="p === '...'" (click)="goTo(p)" [disabled]="p === '...'">
          {{ p }}
        </button>
        <button (click)="next()" [disabled]="page === totalPages" class="page-nav">
          <span class="material-icons">chevron_right</span>
        </button>
      </div>
    </div>
  </div>
</section>


<section class="section">
  <div class="container">
    <div class="admin-toolbar">
      <div class="toolbar-search">
        <span class="material-icons">search</span>
        <input type="text" class="form-control" [(ngModel)]="search" placeholder="Tìm kiếm người dùng...">
      </div>
    </div>
    <div class="loading-spinner" *ngIf="loading"><div class="spinner"></div></div>
    <div class="data-table-wrapper" *ngIf="!loading">
      <table class="data-table">
        <thead><tr><th>Người dùng</th><th>Email</th><th>Vai trò</th><th>Trạng thái</th><th>Ngày tạo</th><th>Hành động</th></tr></thead>
        <tbody>
          <tr *ngFor="let u of filteredUsers()">
            <td>
              <div class="user-cell">
                <div class="user-avatar-sm"><span class="material-icons">person</span></div>
                <strong>{{ u.fullName }}</strong>
              </div>
            </td>
            <td style="color:var(--gray);font-size:0.875rem;">{{ u.email }}</td>
            <td><span class="badge" [class.badge-danger]="u.role.name==='admin'" [class.badge-primary]="u.role.name==='user'">{{ u.role.name === 'admin' ? 'Quản trị' : 'Người dùng' }}</span></td>
            <td><span class="badge" [class.badge-success]="u.isActive" [class.badge-warning]="!u.isActive">{{ u.isActive ? 'Hoạt động' : 'Khóa' }}</span></td>
            <td>{{ u.createdAt | date:'dd/MM/yyyy' }}</td>
            <td>
              <div class="action-btns">
                <button class="btn btn-sm" [class.btn-secondary]="u.isActive" [class.btn-primary]="!u.isActive" (click)="toggle(u.id)">
                  <span class="material-icons">{{ u.isActive ? 'block' : 'check_circle' }}</span>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="empty-state" *ngIf="!loading && filteredUsers().length === 0">
      <span class="material-icons">people_outline</span>
      <h3>Không có người dùng</h3>
    </div>
  </div>
</section>
